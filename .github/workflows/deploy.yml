name: Deploy

# Deploys after CI passes on main. Also runnable manually — tick "bootstrap"
# the very first time to run `kamal setup` (installs kamal-proxy + first boot).
on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "First-time bootstrap (kamal setup instead of kamal deploy)"
        type: boolean
        default: false
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── API: build image, push to GHCR, deploy with Kamal ──────────────────────
  deploy-api:
    # Only run if CI succeeded (or when dispatched manually)
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push image to ghcr.io
    env:
      # kamal-proxy/registry
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      # .kamal/secrets reads these from the environment:
      SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      HELCIM_API_TOKEN: ${{ secrets.HELCIM_API_TOKEN }}
      HELCIM_WEBHOOK_VERIFIER_TOKEN: ${{ secrets.HELCIM_WEBHOOK_VERIFIER_TOKEN }}
      SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
      SQUARE_WEBHOOK_SIGNATURE_KEY: ${{ secrets.SQUARE_WEBHOOK_SIGNATURE_KEY }}
      SIMPLYBOOK_LOGIN: ${{ secrets.SIMPLYBOOK_LOGIN }}
      SIMPLYBOOK_API_USER_KEY: ${{ secrets.SIMPLYBOOK_API_USER_KEY }}
      SIMPLYBOOK_WEBHOOK_SECRET: ${{ secrets.SIMPLYBOOK_WEBHOOK_SECRET }}
      SIMPLYBOOK_COMPANY: ${{ secrets.SIMPLYBOOK_COMPANY }}
      SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
      SMTP_ADDRESS: ${{ secrets.SMTP_ADDRESS }}
      TRACCAR_URL: ${{ secrets.TRACCAR_URL }}
      TRACCAR_USER: ${{ secrets.TRACCAR_USER }}
      TRACCAR_PASSWORD: ${{ secrets.TRACCAR_PASSWORD }}
      TRACCAR_WEBHOOK_SECRET: ${{ secrets.TRACCAR_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.2"

      - name: Install Kamal
        run: gem install kamal -v 2.11.0

      - uses: docker/setup-buildx-action@v3

      # config/master.key is gitignored; .kamal/secrets does `cat config/master.key`.
      - name: Write master key
        run: |
          echo "${{ secrets.RAILS_MASTER_KEY }}" > config/master.key
          chmod 600 config/master.key

      - name: Load deploy SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust the server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT || '2206' }}" -t rsa,ecdsa,ed25519 "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          ssh-keyscan -p "${{ secrets.SSH_PORT || '2206' }}" -t rsa,ecdsa,ed25519 -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Kamal deploy (or bootstrap)
        run: |
          if [ "${{ inputs.bootstrap }}" = "true" ]; then
            kamal setup      # first time: install kamal-proxy + boot + deploy
          else
            kamal deploy
          fi

  # ── Frontend: build image on the runner → push to GHCR → run it on the box ─
  # No git/npm/build on the server — same image pipeline as the API.
  deploy-frontend:
    needs: deploy-api
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/asmadeous/bayd-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.baydspa.ca/api/v1
            NEXT_PUBLIC_SQUARE_APP_ID=${{ secrets.SQUARE_APP_ID }}
            NEXT_PUBLIC_SQUARE_LOCATION_ID=${{ secrets.SQUARE_LOCATION_ID }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_SIMPLYBOOK_PWA_URL=${{ secrets.SIMPLYBOOK_PWA_URL }}
            NEXT_PUBLIC_TAWK_PROPERTY_ID=${{ secrets.TAWK_PROPERTY_ID }}
            NEXT_PUBLIC_TAWK_WIDGET_ID=${{ secrets.TAWK_WIDGET_ID }}
            NEXT_PUBLIC_COMPANY_PHONE=${{ secrets.COMPANY_PHONE }}
            NEXT_PUBLIC_GOOGLE_MAPS_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Load deploy SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust the server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT || '2206' }}" -t rsa,ecdsa,ed25519 "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          ssh-keyscan -p "${{ secrets.SSH_PORT || '2206' }}" -t rsa,ecdsa,ed25519 -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull & run the container on the server
        run: |
          ssh -p "${{ secrets.SSH_PORT || '2206' }}" deploy@"${{ secrets.SSH_HOST }}" bash -lc "
            set -e
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            docker pull '${{ env.IMAGE }}:${{ github.sha }}'
            docker rm -f bayd-frontend 2>/dev/null || true
            docker run -d --name bayd-frontend --restart unless-stopped \
              -p 127.0.0.1:3001:3000 '${{ env.IMAGE }}:${{ github.sha }}'
            docker image prune -f
          "
