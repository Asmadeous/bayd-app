# ActionCable transport. Solid Cable (Postgres) in production — no Redis, matching
# this app's Solid Queue/Cache setup. Async in dev, test adapter in specs.
development:
  adapter: async

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
