# Kamal deploy config for B.A.Y.D API (api.baydspa.ca).
# Front door is nginx on this host (TLS via certbot). kamal-proxy runs bound to
# 127.0.0.1:8080 with TLS OFF; nginx forwards api.baydspa.ca → 127.0.0.1:8080.

service: b_a_y_d_api

# Image name on your registry. EDIT the registry user.
image: ghcr.io/asmadeous/bayd-app

# Server host comes from the SSH_HOST env var (set in CI / your shell) so a
# host/IP change never needs a code edit. Fails loudly if unset.
servers:
  web:
    - <%= ENV.fetch("SSH_HOST") %>

# nginx terminates TLS and forwards to kamal-proxy, which listens on localhost
# only (no public port, no Let's Encrypt — nginx handles certs). It still does
# gapless routing to the app container and trusts nginx's X-Forwarded-* headers.
proxy:
  ssl: false
  host: api.baydspa.ca
  app_port: 3000
  forward_headers: true
  run:
    http_port: 8080
    https_port: 8443
    bind_ips:
      - "127.0.0.1"

# The app entrypoint waits for the Postgres accessory (initdb + PostGIS) and runs
# migrations before the web server binds, so on a fresh bootstrap the container
# needs longer than the 30s default to report healthy. deploy_timeout is a
# top-level Kamal option (not under proxy).
deploy_timeout: 120

# EDIT: container registry. GHCR shown; alternatives: docker.io, registry.digitalocean.com …
registry:
  server: ghcr.io
  username: asmadeous
  password:
    - KAMAL_REGISTRY_PASSWORD

# Connect as the non-root deploy user on the custom SSH port (root login disabled).
ssh:
  user: deploy
  port: <%= ENV.fetch("SSH_PORT", "2206") %>

builder:
  arch: amd64

# Persist Active Storage files (invoices, job-application PDFs) across deploys.
# The host path is created by deploy/server-setup.sh.
volumes:
  - "/var/lib/bayd/storage:/rails/storage"

env:
  clear:
    # Jobs run inside Puma (Solid Queue) — no separate worker machine.
    SOLID_QUEUE_IN_PUMA: true

    # Hosts / URLs
    APP_HOST: api.baydspa.ca
    APP_URL: https://baydspa.ca
    # Website + the three Capacitor apps' WebView origins (m-*.baydspa.ca). CORS,
    # ActionCable, and WebAuthn all read this; a mobile app whose origin is missing
    # here gets its API responses blocked.
    # iOS Capacitor uses the capacitor:// scheme; Android uses https://. Both must
    # be listed per app or the iOS apps' API calls are CORS-blocked.
    ALLOWED_ORIGINS: https://baydspa.ca,https://m-customer.baydspa.ca,https://m-staff.baydspa.ca,https://m-admin.baydspa.ca,capacitor://m-customer.baydspa.ca,capacitor://m-staff.baydspa.ca,capacitor://m-admin.baydspa.ca

    # Database — the "db" accessory below (Kamal-managed Postgres+PostGIS
    # container). The accessory is reachable by its name on the Kamal Docker
    # network, so no host bridge / pg_hba juggling. For a managed/external DB,
    # put its host here instead.
    DB_HOST: b_a_y_d_api-db
    DB_PORT: 5432

    # Behaviour
    BOOKING_TIMEZONE: America/Toronto
    CHECKOUT_GATEWAY: helcim
    JITSI_HOST: meet.jit.si
    SUPPORT_EMAIL: Bookings@baydspa.ca
    FUEL_RATE_PER_KM: "0.68"

    # Passkeys (non-secret): relying-party id = the registrable domain.
    WEBAUTHN_RP_ID: baydspa.ca

    # Payments (non-secret ids / URLs)
    SQUARE_BASE_URL: https://connect.squareup.com
    SQUARE_WEBHOOK_NOTIFICATION_URL: https://api.baydspa.ca/api/v1/webhooks/square

    # Mail — 465 = SpaceMail's implicit-TLS port (see smtp_settings in
    # config/environments/production.rb, which auto-selects TLS vs STARTTLS
    # based on this port).
    SMTP_PORT: "465"

    # From address on all outbound mail. MUST match the authenticated mailbox
    # (SMTP_USERNAME = noreply@baydspa.ca) — SpaceMail silently drops mail whose
    # From it doesn't own, so a mismatch breaks every email even though SMTP auth
    # succeeds and the app reports "sent". Keep this and SMTP_USERNAME aligned.
    MAIL_FROM: "Beauty @ Your Door <noreply@baydspa.ca>"

    # Google OAuth callback (must exactly match a redirect URI in Google Console)
    GOOGLE_REDIRECT_URI: https://api.baydspa.ca/api/v1/auth/google/callback

    # NOTE: SQUARE_LOCATION_ID, SMTP_ADDRESS, and the FCM/Infobip secrets are
    # injected from GitHub (see env.secret) — no values here.

    # Ops
    RAILS_LOG_LEVEL: info
    SENTRY_TRACES_SAMPLE_RATE: "0.1"
    REQUEST_TIMEOUT_SECONDS: "15"

  # Values resolved from .kamal/secrets (which reads your shell env / env file).
  secret:
    - RAILS_MASTER_KEY
    - SECRET_KEY_BASE
    - DB_USERNAME
    - DB_PASSWORD
    - SMTP_USERNAME
    - SMTP_PASSWORD
    - GOOGLE_MAPS_API_KEY
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - SENTRY_DSN
    - HELCIM_API_TOKEN
    - HELCIM_WEBHOOK_VERIFIER_TOKEN
    - SQUARE_ACCESS_TOKEN
    - SQUARE_WEBHOOK_SIGNATURE_KEY
    - SQUARE_LOCATION_ID
    # Square Tap to Pay POS (staff app). Blank keeps Tap to Pay inert.
    - SQUARE_APPLICATION_ID
    - SQUARE_ENVIRONMENT
    - SMTP_ADDRESS
    # Push (FCM) — blank keeps push inert
    - FCM_PROJECT_ID
    - FCM_CREDENTIALS_JSON
    # Phone-OTP (Infobip) — blank keeps OTP send inert
    - INFOBIP_BASE_URL
    - INFOBIP_API_KEY
    - INFOBIP_SENDER
    # TESTING ONLY — disables the clock-in geofence. REMOVE before public launch.
    - GEOFENCE_DISABLED

# Kamal-managed Postgres + PostGIS, replacing the host Postgres. Runs as a
# container on the Kamal Docker network, reachable by name (b_a_y_d_api-db) from
# the app - no host bridge / listen_addresses / pg_hba juggling. The postgis
# image ships the postgis + btree_gist + pgcrypto extensions the schema enables.
# Data lives in the named volume, so it survives redeploys (only a volume delete
# wipes it). Credentials come from the SAME DB_USERNAME/DB_PASSWORD secrets the
# app uses, so both sides always agree. POSTGRES_DB creates the primary DB;
# Rails db:prepare creates the cache/queue/cable DBs on first boot.
accessories:
  db:
    # Postgres 18 + PostGIS 3.6, matching the dev environment (local psql 18.x).
    image: postgis/postgis:18-3.6
    host: <%= ENV.fetch("SSH_HOST") %>
    env:
      clear:
        POSTGRES_DB: bayd_production
      secret:
        - POSTGRES_USER
        - POSTGRES_PASSWORD
    volumes:
      # Postgres 18+ images store data in a version-specific subdirectory and
      # REQUIRE the mount at /var/lib/postgresql (NOT /var/lib/postgresql/data,
      # the pre-18 convention) - mounting at /data makes the container refuse to
      # start with a "data in unused mount/volume" error and crash-loop.
      - bayd_db_data:/var/lib/postgresql

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell:   app exec --interactive --reuse "bash"
  logs:    app logs -f
  dbc:     app exec --interactive --reuse "bin/rails dbconsole --include-password"
